# SPDX-License-Identifier: GPL-2.0
#
# CI: build my-driver.ko against every supported Android KMI and compile the
# Android arm64 client, probe, and benchmark against the shared UAPI.
#
# Each matrix entry runs inside the matching ghcr.io/ylarod/ddk image, which
# ships a pre-extracted kernel tree at $KERNEL_SRC. The Makefile picks that
# up automatically (no flags required).
#
# Artefact naming: my-driver-<kmi>.ko (one upload per matrix leg) plus a
# userspace-arm64-v8a bundle.

name: build

on:
  push:
    branches:
      - main
      - master
      - dev
  pull_request:
  workflow_dispatch:
    inputs:
      ddk_release:
        description: 'ghcr.io/ylarod/ddk image tag suffix (release date)'
        required: false
        default: '20251016'
        type: string

jobs:
  userspace:
    name: build userspace arm64-v8a
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Show Android NDK environment
        run: |
          set -eux
          test -n "${ANDROID_NDK_HOME}"
          test -f "${ANDROID_NDK_HOME}/build/cmake/android.toolchain.cmake"
          "${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin/clang" --version
          cmake --version

      - name: Build C++ client
        run: |
          set -eux
          cmake -S client -B out/client \
            -DCMAKE_TOOLCHAIN_FILE="${ANDROID_NDK_HOME}/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-30 \
            -DANDROID_STL=c++_static \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build out/client -j"$(nproc)"

      - name: Build probe and benchmark
        run: |
          set -eux
          cmake -S scripts -B out/scripts \
            -DCMAKE_TOOLCHAIN_FILE="${ANDROID_NDK_HOME}/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-30 \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build out/scripts -j"$(nproc)"

      - name: Upload userspace tools
        uses: actions/upload-artifact@v4
        with:
          name: userspace-arm64-v8a
          path: |
            out/client/my-driver-client
            out/scripts/drv_probe
            out/scripts/drv_bench
          if-no-files-found: error
          retention-days: 30

  build:
    name: build ${{ matrix.kmi }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        kmi:
          - android12-5.10
          - android13-5.10
          - android13-5.15
          - android14-5.15
          - android14-6.1
          - android15-6.6
          - android16-6.12

    container:
      image: ghcr.io/ylarod/ddk:${{ matrix.kmi }}-${{ inputs.ddk_release || '20251016' }}
      options: --privileged

    env:
      DRIVER_NAME: my-driver

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Show build environment
        working-directory: driver
        run: |
          echo "=== KMI:           ${{ matrix.kmi }}"
          echo "=== DDK image tag: ${{ matrix.kmi }}-${{ inputs.ddk_release || '20251016' }}"
          echo "=== KERNEL_SRC:    $KERNEL_SRC"
          echo "=== DRIVER_NAME:   $DRIVER_NAME"
          uname -a
          which clang || true
          clang --version || true

      - name: Build ${{ env.DRIVER_NAME }}.ko
        working-directory: driver
        run: |
          set -eux
          make -j"$(nproc)"
          ls -la "${DRIVER_NAME}.ko"

      - name: Stage artefact (rename per-KMI)
        working-directory: driver
        run: |
          set -eux
          mkdir -p "${GITHUB_WORKSPACE}/out"
          OUT="${GITHUB_WORKSPACE}/out/${DRIVER_NAME}-${{ matrix.kmi }}.ko"
          cp "${DRIVER_NAME}.ko" "$OUT"
          echo "Size (unstripped):  $(du -h "$OUT" | cut -f1)"
          if command -v llvm-strip >/dev/null 2>&1; then
            llvm-strip -d "$OUT"
            echo "Size (stripped -d): $(du -h "$OUT" | cut -f1)"
          fi
          ls -la "$OUT"

      - name: Upload ${{ env.DRIVER_NAME }}-${{ matrix.kmi }}.ko
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.DRIVER_NAME }}-${{ matrix.kmi }}.ko
          path: out/${{ env.DRIVER_NAME }}-${{ matrix.kmi }}.ko
          if-no-files-found: error
          retention-days: 30
